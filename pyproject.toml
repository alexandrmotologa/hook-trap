[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hook-trap"
version = "0.1.0"
description = "Real-time webhook inspector, debugger, and local replay proxy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Alexandru Motologa", email = "alexandru@example.com" }
]
keywords = ["webhook", "inspector", "proxy", "fastapi", "websockets", "replay", "stripe", "github"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.8.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
hook-trap = "hook_trap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["hook_trap"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["UP015"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
